<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xác Nhận Gửi Dữ Liệu</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        
        .message-box {
            background-color: #d8f8ff;
            border: 2px solid #0055a5;
            width: 500px;
            margin: 0 auto;
            padding: 30px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        
        h2 {
            color: #0055a5;
            margin-bottom: 15px;
        }
        
        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px; 
        }
        
        a.btn {
            background-color: #0055a5;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px
        }
        
        a.btn:hover {
            background-color: #003d7a;
        }

        a.btn-edit {
            background-color: #5ab2c9; 
        }
        a.btn-edit:hover {
            background-color: #4095aa;
        }
    
    </style>
</head>
<body>
    
    <div class="message-box">
    <h2>Gửi thành công!</h2>
    <p>Dữ liệu của bạn đã được gửi thành công đến tài khoản GitHub của tôi.</p>
    <div class="btn-group">
        <a href="travel_report.html" class="btn">Quay lại form</a>
        <a href="javascript:history.back()" class="btn btn-edit">Chỉnh sửa form</a>
    </div>
</div>
