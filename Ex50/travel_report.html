<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Expense Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div class="header-banner">
            <img src="DeLong.jpg" alt="DeLong Enterprises Logo" class="logo-img">
        </div>

        <h1>Travel Expense Report</h1>
        <hr class="divider">

        <form action="#" method="post">
            
            <div class="form-group">
                <label>1) First Name:</label>
                <input type="text" name="first_name">
                <label class="inline-label">Last Name:</label>
                <input type="text" name="last_name">
            </div>

            <div class="form-group">
                <label>2) Social Security Number:</label>
                <input type="text" name="ssn" class="short-input">
            </div>

            <div class="form-group">
                <label>3) Department:</label>
                <select name="department">
                    <option value="Accounting">Accounting</option>
                    <option value="Sales">Sales</option>
                    <option value="Marketing">Marketing</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="HR">Human Resources (HR)</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                    <option value="R&D">Research & Development (R&D)</option>
                </select>
            </div>

            <div class="form-group">
                <label>4) Describe the purpose of your trip.</label><br>
                <textarea name="purpose" rows="4" cols="60"></textarea>
            </div>

            <div class="form-group">
                <label>5) Itemize your travel expenses</label>
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="date" name="date[]"></td>
                            <td><input type="text" name="desc[]"></td>
                            <td>
                                <select name="category[]">
                                    <option value="Meal">Meal</option>
                                    <option value="Flight">Flight</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Supplies">Supplies</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount[]" class="amount-input"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="date[]"></td>
                            <td><input type="text" name="desc[]"></td>
                            <td>
                                <select name="category[]">
                                    <option value="Meal">Meal</option>
                                    <option value="Flight">Flight</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transportation">Transport</option>
                                    <option value="Supplies">Supplies</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount[]" class="amount-input"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="date[]"></td>
                            <td><input type="text" name="desc[]"></td>
                            <td>
                                <select name="category[]">
                                    <option value="Meal">Meal</option>
                                    <option value="Flight">Flight</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Supplies">Supplies</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount[]" class="amount-input"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="date[]"></td>
                            <td><input type="text" name="desc[]"></td>
                            <td>
                                <select name="category[]">
                                    <option value="Meal">Meal</option>
                                    <option value="Flight">Flight</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Supplies">Supplies</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount[]" class="amount-input"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-group">
                <label>6) Have you submitted your receipts?</label>
                <input type="radio" id="yes" name="submitted" value="Yes">
                <label for="yes" class="radio-label">Yes</label>
                <input type="radio" id="no" name="submitted" value="No">
                <label for="no" class="radio-label">No</label>
            </div>

            <div class="form-actions">
                <button type="button" onclick="window.location.href='thongbao.html'">Submit travel expenses</button>
                <input type="reset" value="Reset">
            </div>

        </form>

        <p class="footer-note">Questions? Contact Debbie Larson in Accounting (ext. 2150).</p>

    </div>

</body>
</html>
